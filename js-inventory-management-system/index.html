<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1> Inventory Management System</h1>

<!-- INPUT SECTION -->
<div class="box">
  <input type="text" id="name" placeholder="Product Name">
  <input type="text" id="category" placeholder="Category">
  <input type="number" id="price" placeholder="Price">
  <input type="number" id="qty" placeholder="Quantity">

  <button id="addBtn" onclick="addProduct()">Add Product</button>
</div>

<!-- SEARCH + FILTER -->
<div class="box">
  <input type="text" id="search" placeholder="Search product..." onkeyup="render()">
  
  <select id="filter" onchange="render()">
    <option value="">All Categories</option>
  </select>
</div>

<!-- DASHBOARD -->
<div class="dashboard">
  <p>Total Products: <span id="totalProducts">0</span></p>
  <p>Total Quantity: <span id="totalQty">0</span></p>
  <p>Total Value: ₹<span id="totalValue">0</span></p>
</div>

<!-- PRODUCT LIST -->
<div id="list"></div>

<script src="script.js"></script>
</body>
</html>

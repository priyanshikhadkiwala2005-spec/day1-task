<!DOCTYPE html>
<html>
<head>
    <title>My Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1>My Website</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    
    <section class="about">
        <h2>About Us</h2>
        <p>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
